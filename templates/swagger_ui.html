<!DOCTYPE html>
<html>

<head>
  <title>{{ title|default:"Avemaria API Documentation" }}</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@latest/favicon-32x32.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@latest/swagger-ui.css">
  <style>
    html {
      box-sizing: border-box;
      overflow-y: scroll;
    }

    *,
    *:after,
    *:before {
      box-sizing: inherit;
    }

    body {
      background: #f8fafc;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .swagger-ui .topbar {
      display: none;
    }


    /* Main Headings */
    .section-main-heading {
      margin: 36px 0 16px 0;
      padding: 14px 20px;
      border-radius: 8px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
      user-select: none;
    }

    .section-main-heading.user-side {
      background: linear-gradient(135deg, #047857 0%, #065f46 100%);
      color: #ffffff;
      border-left: 6px solid #10b981;
    }

    .section-main-heading.admin-side {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
      border-left: 6px solid #38bdf8;
    }

    .section-main-heading .badge {
      font-size: 11px;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.22);
      font-weight: 600;
      letter-spacing: 0.6px;
    }

    /* Tag styling */
    .swagger-ui .opblock-tag-section {
      margin-bottom: 8px;
    }

    .swagger-ui .opblock-tag {
      font-size: 15px;
      font-weight: 600;
      border-bottom: 1px solid #e2e8f0;
    }

    .swagger-ui .opblock-tag small {
      color: #64748b;
      font-size: 13px;
      font-weight: 400;
    }

    .swagger-ui .info {
      margin: 24px 0;
    }

    .swagger-ui .info .title {
      color: #0f172a;
      font-weight: 800;
    }
  </style>
</head>

<body>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@latest/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@latest/swagger-ui-standalone-preset.js"></script>
  {% if script_url %}
  <script src="{{ script_url }}"></script>
  {% else %}
  <script>
    {% include template_name_js %}
  </script>
  {% endif %}

  <script>
    function injectSectionHeadings() {
      const tagSections = document.querySelectorAll('.opblock-tag-section');
      if (!tagSections.length) {
        return;
      }

      let userHeaderInjected = false;
      let adminHeaderInjected = false;

      tagSections.forEach(section => {
        const prev = section.previousElementSibling;
        if (prev && prev.classList.contains('section-main-heading')) {
          if (prev.classList.contains('user-side')) userHeaderInjected = true;
          if (prev.classList.contains('admin-side')) adminHeaderInjected = true;
        }

        const tagHeader = section.querySelector('.opblock-tag');
        if (!tagHeader) return;
        const tagName = tagHeader.getAttribute('data-tag') || tagHeader.textContent || '';

        if ((tagName.includes('USER SIDE') || tagName.includes('STUDENT SIDE')) && !userHeaderInjected) {
          const h = document.createElement('div');
          h.className = 'section-main-heading user-side';
          h.innerHTML = '<span>👤 USER SIDE</span><span class="badge">Student & Public APIs</span>';
          section.parentNode.insertBefore(h, section);
          userHeaderInjected = true;
        }

        if (tagName.includes('ADMIN SIDE') && !adminHeaderInjected) {
          const h = document.createElement('div');
          h.className = 'section-main-heading admin-side';
          h.innerHTML = '<span>🛡️ ADMIN SIDE</span><span class="badge">Management & Portal APIs</span>';
          section.parentNode.insertBefore(h, section);
          adminHeaderInjected = true;
        }
      });
    }

    window.addEventListener('load', () => {
      setTimeout(injectSectionHeadings, 200);
    });

    // Poll periodically to ensure headings remain injected even after swagger filters/re-renders
    setInterval(injectSectionHeadings, 300);
  </script>
</body>

</html>
